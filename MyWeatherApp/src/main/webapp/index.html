<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <style>
    body {
      margin: 0;
      height: 100vh; /* full viewport */
      display: flex;
      justify-content: center; /* horizontal center */
      align-items: center;     /* vertical center */
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      background: #fff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 350px;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
      font-size: 22px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      text-align: center;
      transition: 0.2s;
    }

    input:focus {
      border-color: #4CAF50;
      box-shadow: 0px 0px 5px rgba(76, 175, 80, 0.5);
    }

    button {
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #4CAF50;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #45a049;
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌤️ Weather Web App</h1>
    <form action="MyServlet" method="post">
      <input name="city" placeholder="Enter city name" required />
      <button type="submit">Get Weather</button>
    </form>
    <div class="footer">Powered by OpenWeatherMap</div>
  </div>
</body>
</html>
